<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>$title · 中文文档</title>
<style>$theme_css</style>
<style>
html{scroll-behavior:auto}body{margin:0!important;background:#fff!important;color:#262730;font:16px/1.75 "Microsoft YaHei",Arial,sans-serif}*{box-sizing:border-box}a{color:#0068c9}a:hover{text-decoration:underline}button,input{font:inherit}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #0068c9;outline-offset:3px}[hidden]{display:none!important}
.d2c-layout{max-width:1760px;margin:auto;display:grid;grid-template-columns:290px minmax(0,1fr);gap:44px;padding:24px 48px 60px}.d2c-sidebar{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow:auto;padding-right:20px;border-right:1px solid #f1f2f6;font-size:14px}.d2c-home{display:block;color:#31333f;font-weight:700;padding:6px 0 12px}.d2c-nav-group{margin-bottom:26px}.d2c-nav-group h2{font:700 17px/1.4 "Microsoft YaHei",Arial,sans-serif;margin:10px 0 12px;display:flex;align-items:center;gap:12px;color:#555865}.d2c-nav-group h2:before{content:"";width:25px;height:25px;display:block;background:#ff9f1a;border-radius:5px}.d2c-color-1 h2:before{background:#803df5}.d2c-color-2 h2:before{background:#00b8df}.d2c-color-3 h2:before{background:#1b7de8}.d2c-nav-group summary{cursor:pointer;padding:6px 5px 6px 14px;color:#31333f}.d2c-page-link{display:block;margin:3px 0;padding:6px 8px 6px 28px;text-decoration:none;color:#535866;font-size:13px;line-height:1.65;overflow-wrap:anywhere}.d2c-page-link small{font-size:10px;color:#888;margin-left:8px}.d2c-current{background:#f0f2f6;color:#0068c9;border-radius:4px}.d2c-mobile-summary{display:none}
.d2c-main{min-width:0}.d2c-toolbar{display:flex;gap:20px;align-items:center;justify-content:space-between;font-size:12px;color:#6b6f78;margin-bottom:22px;border-bottom:1px solid #f1f2f6;padding-bottom:12px;flex-wrap:wrap}.d2c-toolbar label{display:flex;align-items:center;gap:7px;white-space:nowrap}.d2c-toolbar input[type=checkbox]{accent-color:#803df5}.d2c-search{border:1px solid #d5d9e1;border-radius:5px;padding:6px 10px;max-width:250px;font-size:13px}.d2c-progress{font-size:12px}.d2c-progress summary{cursor:pointer}.d2c-progress-panel{position:absolute;right:24px;z-index:10;background:white;box-shadow:0 4px 25px #0002;border:1px solid #eee;padding:18px;width:min(560px,90vw);max-height:65vh;overflow:auto}.d2c-progress-panel p{font-size:12px}.d2c-progress-panel ul,.d2c-pending-list{list-style:none;margin:0;padding:0}.d2c-progress-panel li,.d2c-pending-list li{padding:8px 0;border-bottom:1px solid #eee;font-size:13px}.d2c-progress-panel li span,.d2c-pending-list li span{display:inline-block;min-width:55px;color:#888}.d2c-pending-list li:target{background:#fff4d7;border:1px solid #ffb628;padding:16px;scroll-margin-top:20px}
#d2c-document{min-width:0;font-size:16px;line-height:1.8}#d2c-document h1{font-size:40px;line-height:1.3;font-weight:700;margin:0 0 22px;letter-spacing:-.025em;color:#262730}#d2c-document h2{font-size:30px;line-height:1.4;font-weight:700;margin:40px 0 22px;color:#262730}#d2c-document h3{font-size:23px;line-height:1.4;font-weight:600;margin:28px 0 16px}#d2c-document h4{font-size:18px;font-weight:600;margin:18px 0 10px}#d2c-document p{margin:0 0 18px}#d2c-document ul,#d2c-document ol{padding-left:28px;margin-bottom:22px}#d2c-document li{margin-bottom:8px}#d2c-document pre{overflow:auto;white-space:pre;font:14px/1.7 Consolas,"Cascadia Code",monospace;background:#f0f2f6;padding:18px 20px;border-radius:6px;max-width:100%;margin:14px 0 24px}#d2c-document code,#d2c-document tt{font-family:Consolas,"Cascadia Code",monospace;font-size:.9em}#d2c-document :not(pre)>code{background:#f0f2f6;border-radius:3px;padding:2px 4px;color:#9b214e}#d2c-document pre code{background:transparent;color:inherit;padding:0;font-size:inherit}#d2c-document img{max-width:100%;height:auto}#d2c-document table{width:100%;border-collapse:collapse;margin:20px 0;display:block;overflow:auto;font-size:14px}#d2c-document th,#d2c-document td{padding:10px 14px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}#d2c-document th{font-weight:600;background:#fafafa}#d2c-document .online-demo{display:block;padding:16px;background:#f0f2f6;border:1px dashed #c6ccd5;border-radius:5px;margin:18px 0}
#d2c-document .d2c-card{background:#faf8ff;border:1px solid #e6dafa;border-left:4px solid #803df5;border-radius:5px;padding:18px 22px;margin:26px 0;font-size:14px;color:#424355;box-shadow:none}#d2c-document .d2c-card-label{font-size:11px;font-weight:700;color:#7141b8;margin-bottom:8px}#d2c-document .d2c-card h3{font-size:18px;margin:0 0 10px}#d2c-document .d2c-card p{margin:0 0 10px}#d2c-document .d2c-card ol,#d2c-document .d2c-card ul{margin-bottom:8px}#d2c-document .d2c-card pre{font-size:13px}.d2c-source{border-top:1px solid #eee;margin-top:40px;padding-top:18px;font-size:12px;color:#777;line-height:1.8}.d2c-source a{margin-right:16px}.d2c-glossary{margin-top:25px;font-size:13px}.d2c-glossary summary{cursor:pointer}.d2c-glossary dl>div{display:flex;gap:20px;border-bottom:1px solid #eee;padding:6px}.d2c-glossary dt{width:180px;font-family:Consolas,monospace}.d2c-glossary dd{margin:0}
@media(max-width:1100px){.d2c-layout{grid-template-columns:240px minmax(0,1fr);gap:28px;padding:24px}#d2c-document h1{font-size:34px}}@media(max-width:760px){.d2c-layout{display:block;padding:18px}.d2c-sidebar{position:static;max-height:none;border:0;padding:0;margin-bottom:20px}.d2c-mobile-summary{display:block;font-weight:700;cursor:pointer;padding:6px 0}#d2c-nav{max-height:50vh;overflow:auto}.d2c-toolbar{gap:12px;margin-bottom:20px}.d2c-search{max-width:180px}#d2c-document h1{font-size:28px}#d2c-document h2{font-size:25px}#d2c-document{font-size:15px}#d2c-document [class*=GridContainer]{grid-template-columns:1fr!important}#d2c-document [class*=inlineCallout_]{display:block!important}#d2c-document [class*=CalloutIcon]{margin-bottom:12px}#d2c-document .d2c-card{padding:16px}.d2c-progress-panel{right:18px}}
@media print{.d2c-sidebar,.d2c-toolbar,.d2c-card,.d2c-progress{display:none!important}.d2c-layout{display:block;padding:0}#d2c-document pre{white-space:pre-wrap}.d2c-source{break-inside:avoid}}
</style>
</head>
<body>
<div class="d2c-layout">
<aside class="d2c-sidebar"><details id="d2c-toc" open><summary class="d2c-mobile-summary">文档目录</summary><nav id="d2c-nav" aria-label="文档目录">$navigation</nav><p id="d2c-no-results" hidden>没有匹配的文档。</p></details></aside>
<main class="d2c-main">
<div class="d2c-toolbar"><input id="d2c-search" class="d2c-search" type="search" aria-label="搜索文档" placeholder="搜索中文、英文或 API"><label><input id="d2c-show-cards" type="checkbox" checked>显示补充讲解</label><details class="d2c-progress"><summary>译文进度 $done / $total</summary><div class="d2c-progress-panel"><p>$coverage</p><p>读取失败：$failed 页</p><p>$source_links</p><ul>$progress</ul></div></details></div>
<article id="d2c-document" class="content">$content</article>
<div class="d2c-source"><a href="$source_url" target="_blank" rel="noopener noreferrer">查看官方原文</a><a href="cards.md" download>Markdown 文档</a>$official_license<div>来源读取时间：$read_at　文档版本：$version</div></div>
<details class="d2c-glossary"><summary>中英术语对照</summary><dl>$glossary</dl></details>
</main></div>
<script>
(() => {
  const toggle=document.getElementById('d2c-show-cards');
  toggle.addEventListener('change',()=>document.querySelectorAll('[data-ai-explanation]').forEach(card=>card.hidden=!toggle.checked));
  const input=document.getElementById('d2c-search');
  const links=Array.from(document.querySelectorAll('.d2c-page-link'));
  input.addEventListener('input',()=>{
    const query=input.value.trim().toLowerCase();let count=0;
    links.forEach(link=>{link.hidden=!link.dataset.search.toLowerCase().includes(query);if(!link.hidden)count++;});
    document.querySelectorAll('.d2c-nav-group details').forEach(group=>{group.hidden=!Array.from(group.querySelectorAll('.d2c-page-link')).some(link=>!link.hidden);if(query&&!group.hidden)group.open=true;});
    document.querySelectorAll('.d2c-nav-group').forEach(group=>group.hidden=!Array.from(group.querySelectorAll('.d2c-page-link')).some(link=>!link.hidden));
    document.getElementById('d2c-no-results').hidden=count!==0;
  });
  const media=window.matchMedia('(max-width:760px)');
  const resize=()=>document.getElementById('d2c-toc').open=!media.matches;
  media.addEventListener('change',resize);resize();
})();
</script>
</body></html>
